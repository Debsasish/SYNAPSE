[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-protocol"
version = "1.0.0"
description = "SYNAPSE: scale-invariant capability activation for LLM agents via a Capability Knowledge Graph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SYNAPSE Working Group" }]
keywords = ["llm", "agents", "tool-use", "mcp", "a2a", "knowledge-graph", "protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
  "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/synapse-protocol/synapse-research"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
